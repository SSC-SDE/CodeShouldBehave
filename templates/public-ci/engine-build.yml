# Install ONLY in the audited analyzer release repository after publication
# authorization. This does not build a customer PR. It is deliberately inactive
# under templates/. The approved source SHA is a repository variable, not PR input.
name: CodeShouldBehave trusted Linux engine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeshouldbehave-engine-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.CSB_RELEASE_SOURCE_SHA == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      CSB_RELEASE_SOURCE_SHA: ${{ vars.CSB_RELEASE_SOURCE_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify fresh hard-zero activation observation
        env:
          CSB_BUDGET_OBSERVATION: ${{ secrets.CSB_RELEASE_BUDGET_OBSERVATION }}
          CSB_BUDGET_SHA256: ${{ vars.CSB_RELEASE_BUDGET_SHA256 }}
          CSB_BUDGET_ACCOUNT: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import os, pathlib, sys, tempfile
          sys.path.insert(0, 'scripts')
          import public_ci as ci
          # This is an observed operator control, never a live billing API claim.
          # Do not echo the proof. It is absent from source/runtime archives.
          with tempfile.TemporaryDirectory(prefix='csb-budget-') as name:
              root = pathlib.Path(name)
              path = root / 'observation.json'
              path.write_text(os.environ.get('CSB_BUDGET_OBSERVATION', ''))
              path.chmod(0o600)
              ci.verify_operator_budget({'budget': {
                  'proof_mode': 'operator_observation',
                  'account': os.environ['CSB_BUDGET_ACCOUNT'],
                  'evidence_path': 'observation.json',
                  'evidence_sha256': os.environ.get('CSB_BUDGET_SHA256', '')
              }}, root, datetime.now(timezone.utc))
          print('hard_zero_activation_observation_valid')
          PY
      - name: Install supported release-packaging Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node24
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install pinned minimum Rust toolchain
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Fetch exact locked analyzer dependencies
        run: cargo +1.87.0 fetch --locked
      - name: Verify public release contracts on the actual builder
        run: python3 -m unittest discover -s tests -p 'public*test.py' -v
      - name: Build exact committed analyzer in a clean source tree
        run: |
          python3 scripts/build_public_release.py --output release --revision "$CSB_RELEASE_SOURCE_SHA" --build-runtime --target x86_64-unknown-linux-gnu
      - name: Enforce release handoff reservation before upload
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('release')
          manifest = json.loads((root/'release-manifest.json').read_text())
          assert manifest['source_commit'] == manifest['native_build']['source_commit']
          assert manifest['native_build']['target'] == 'x86_64-unknown-linux-gnu'
          total = sum((root/a['path']).stat().st_size for a in manifest['assets'])
          total += (root/'release-manifest.json').stat().st_size + (root/'SHA256SUMS').stat().st_size
          # Reserve archive/container overhead within a 32 MiB handoff lane.
          assert total <= 31 * 1024 * 1024, 'release exceeds bounded reservation'
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        id: upload
        with:
          name: codeshouldbehave-linux-release
          path: |
            release/*.tar.gz
            release/release-manifest.json
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node24
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2, Node24
        id: attest
        with:
          subject-path: release/*.tar.gz
          predicate-type: https://github.com/SSC-SDE/codeshouldbehave/attestations/native-build/v1
          predicate-path: release/release-manifest.json
          show-summary: false
      - name: Preserve bounded offline verification bundle
        env:
          CSB_ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path(os.environ['CSB_ATTESTATION_BUNDLE'])
          assert path.is_file() and not path.is_symlink() and path.stat().st_size <= 256*1024
          pathlib.Path('release/native-build.sigstore.json').write_bytes(path.read_bytes())
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        with:
          name: codeshouldbehave-linux-attestation
          path: release/native-build.sigstore.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
