# Merge into bitbucket-pipelines.yml.
image: ghcr.io/ssc-sde/csb@sha256:53e53a1f6374c58dacf90e1c52eca4130d1c82531f217edb56f31a43e507c075

pipelines:
  pull-requests:
    "**":
      - step:
          name: CodeShouldBehave review
          clone:
            depth: full
          script:
            - |
              csb review \
                --repo "$BITBUCKET_CLONE_DIR" \
                --base "$BITBUCKET_PR_DESTINATION_COMMIT" \
                --head "$BITBUCKET_COMMIT" \
                --out-dir "$BITBUCKET_CLONE_DIR/csb-review" \
                --allow-dirty \
                --summary check
          artifacts:
            - csb-review/**
