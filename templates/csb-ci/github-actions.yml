# Copy to .github/workflows/csb-review.yml in your repository.
#
# The pinned action runs the reviewed image, verifies every report hash, posts
# or updates one pull-request summary comment and uploads the 30-day artifact.
# No token, App installation or local server is required.
#
# v1 tracks compatible action releases. For an immutable production pin, use
# the commit SHA documented in templates/csb-ci/README.md. Do not use @main.
name: CodeShouldBehave Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: csb-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeShouldBehave
        uses: SSC-SDE/CodeShouldBehave@v1
        with:
          design: auto
          pages: true
          # Set true to block the job when coverage is incomplete.
          fail-on-incomplete: false
