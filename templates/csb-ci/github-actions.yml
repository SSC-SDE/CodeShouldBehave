# Copy to .github/workflows/csb-review.yml in your repository.
# Requires the published image: ghcr.io/ssc-sde/csb
#
# This workflow always:
#   - generates and verifies the interactive report from the pull request's
#     exact base/head commits;
#   - posts or updates one pull-request summary comment;
#   - uploads the report as a 30-day workflow artifact.
#
# It never commits reports. To publish a browsable report on this repository's
# own GitHub Pages, also install `github-actions-pages.yml` and read
# `templates/csb-ci/README.md`.
name: CodeShouldBehave Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: csb-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CSB_IMAGE: ghcr.io/ssc-sde/csb:latest

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run csb review
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$RUNNER_TEMP/csb-review:/out" \
            "$CSB_IMAGE" review \
              --repo /repo \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --out-dir /out \
              --allow-dirty \
              --design auto \
              --summary markdown > "$RUNNER_TEMP/summary.md"
        continue-on-error: true

      - name: Verify report integrity
        if: always()
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/csb-review:/review:ro" \
            "$CSB_IMAGE" verify --dir /review

      - name: Post review summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/summary.md`;
            if (!fs.existsSync(path)) return;
            const marker = '<!-- csb-review -->';
            const linkMarker = '<!-- csb-pages -->';
            const previous = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = previous.data.find(comment => comment.body?.includes(marker));
            const pages = existing?.body.includes(linkMarker)
              ? existing.body.slice(existing.body.indexOf(linkMarker))
              : '';
            const body = `${marker}\n${fs.readFileSync(path, 'utf8')}` +
              (pages ? `\n\n${pages}` : '');
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload interactive review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csb-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/csb-review
          retention-days: 30
