# Copy to .github/workflows/csb-review.yml in your repository.
# Requires a published image: ghcr.io/ssc-sde/csb
name: CodeShouldBehave Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run csb review
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$RUNNER_TEMP/csb-review:/out" \
            ghcr.io/ssc-sde/csb:latest review \
              --repo /repo \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --out-dir /out \
              --allow-dirty \
              --summary markdown > "$RUNNER_TEMP/summary.md"
        continue-on-error: true

      - name: Post review summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/summary.md`;
            if (!fs.existsSync(path)) return;
            const marker = '<!-- csb-review -->';
            const body = `${marker}\n${fs.readFileSync(path, 'utf8')}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload interactive review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csb-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/csb-review
          retention-days: 30
