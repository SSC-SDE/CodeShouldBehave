# Copy to .github/workflows/csb-pages.yml in your repository.
# Optional companion to `github-actions.yml` (copy that file first).
#
# Requires:
#   - Settings -> Pages -> Build and deployment -> Source: "GitHub Actions";
#   - repository variable CSB_PAGES=true.
#
# Why a second workflow: GitHub Pages deployments are protected by the
# `github-pages` environment, which commonly allows only the default branch.
# This workflow is triggered by the completed review run, so it executes on the
# default branch, downloads the already-verified report artifact, and deploys
# it. Pages keeps only the latest deployment; each report is replaced by the
# next same-repository pull request. Nothing is committed to the repository.
#
# Only same-repository pull requests are deployed. Fork runs have a read-only
# token and are skipped. The report artifact is re-verified before deployment.
name: CodeShouldBehave Pages

on:
  workflow_run:
    workflows: ["CodeShouldBehave Review"]
    types: [completed]

concurrency:
  group: csb-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.CSB_PAGES == 'true' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch the verified report artifact
        uses: actions/download-artifact@v4
        with:
          name: csb-review-${{ github.event.workflow_run.pull_requests[0].number }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/csb-review
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recheck every report hash
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/csb-review:/review:ro" \
            ghcr.io/ssc-sde/csb@sha256:53e53a1f6374c58dacf90e1c52eca4130d1c82531f217edb56f31a43e507c075 verify --dir /review

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/csb-review

      - name: Deploy the report to this repository's Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link the live report in the summary comment
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const marker = '<!-- csb-review -->';
            const linkMarker = '<!-- csb-pages -->';
            const issue_number = Number(process.env.PULL_REQUEST);
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (!existing) return;
            const summary = existing.body.split(linkMarker)[0].trimEnd();
            const link = `📎 [Latest interactive report](${process.env.PAGE_URL}) — replaced by the next pull request.`;
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body: `${summary}\n\n${linkMarker}\n${link}\n`,
            });
